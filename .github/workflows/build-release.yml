name: Build OC-LuaJ

on:
  pull_request:
  push:
    branches: [new, 'dev/**']
    tags: ['oc-luaj-*']
  workflow_dispatch:

concurrency:
  group: oc-luaj-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
      - name: Verify and package the shaded OC-LuaJ JAR
        run: mvn --batch-mode --no-transfer-progress --projects oc-luaj --also-make verify
      - name: Prepare release artifact
        run: |
          mkdir release
          jar="$(find oc-luaj/target -maxdepth 1 -type f -name 'oc-luaj-*.jar' ! -name '*-sources.jar' | head -n 1)"
          test -n "$jar"
          cp "$jar" release/OC-LuaJ.jar
          (cd release && sha256sum OC-LuaJ.jar > OC-LuaJ-SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: OC-LuaJ
          path: release/*
          if-no-files-found: error

  release:
    name: Publish Java release
    needs: build
    if: startsWith(github.ref, 'refs/tags/oc-luaj-')
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: OC-LuaJ
          path: release
      - name: Publish checksummed OC-LuaJ JAR
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          release_json="$(curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --data "{\"tag_name\":\"$RELEASE_TAG\",\"name\":\"OC-LuaJ $RELEASE_TAG\",\"generate_release_notes\":true}" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases")"
          upload_url="$(printf '%s' "$release_json" | jq -r '.upload_url' | sed 's/{?name,label}//')"
          test -n "$upload_url" && test "$upload_url" != null
          for asset in release/OC-LuaJ.jar release/OC-LuaJ-SHA256SUMS.txt; do
            curl --fail-with-body --silent --show-error \
              --request POST \
              --header "Authorization: Bearer $GITHUB_TOKEN" \
              --header 'Content-Type: application/octet-stream' \
              --data-binary "@$asset" \
              "$upload_url?name=$(basename "$asset")" >/dev/null
          done
